name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "HomeKTV-Mac/**"
      - ".github/workflows/macos-build.yml"
  pull_request:
    paths:
      - "HomeKTV-Mac/**"
      - ".github/workflows/macos-build.yml"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        working-directory: HomeKTV-Mac
        run: bash build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HomeKTV-Mac-macos
          path: HomeKTV-Mac/dist/HomeKTV-Mac-macos.zip
